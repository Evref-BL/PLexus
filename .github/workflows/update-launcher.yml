name: Apply pharo-launcher-mcp release

on:
  repository_dispatch:
    types: [component-release]
  workflow_dispatch:
    inputs:
      launcher_version:
        description: Published pharo-launcher-mcp version to apply.
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.component == 'pharo-launcher-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: PLexus

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
          package-manager-cache: false

      - name: Verify the published release
        id: release
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.launcher_version }}
        run: |
          version="${EVENT_VERSION:-$INPUT_VERSION}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          # The dispatch that starts this workflow is sent the moment the
          # publish returns, and npm's metadata lags behind it. Asked once,
          # ten seconds after a successful publish of 0.2.0, the registry
          # answered 404 and this whole update stopped at its first step. The
          # install two steps down needs the same thing to be there, so wait
          # for the registry rather than racing it. Its lag is not bounded: the
          # pharo-launcher-mcp 1.1.0 publish of 2026-11-27 took four minutes to
          # show, five seconds past the 225 this step gave it then. Wait by the
          # clock, well within the job's timeout.
          deadline=$((SECONDS + 900))
          until [ "$(npm view "@evref-bl/pharo-launcher-mcp@${version}" version 2>/dev/null)" = "$version" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "@evref-bl/pharo-launcher-mcp@${version} did not reach the registry in 15 minutes." >&2
              exit 1
            fi
            echo "::notice::@evref-bl/pharo-launcher-mcp@${version} is not in the registry yet"
            sleep 15
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare the update
        id: update
        env:
          LAUNCHER_VERSION: ${{ steps.release.outputs.version }}
        run: |
          pin_file="packages/plexus/package.json"
          current_version="$(node -p "require('./${pin_file}').dependencies['@evref-bl/pharo-launcher-mcp']")"
          test -n "$current_version"
          if [[ "$current_version" == "$LAUNCHER_VERSION" ]]; then
            exit 0
          fi
          # The registry lists a version before it serves its tarball, for minutes
          # at times, and installing it in between fails with a 404.
          wait_for_npm() {
            for attempt in $(seq 60); do
              tarball="$(npm view "$1" dist.tarball 2>/dev/null || true)"
              if [[ -n "$tarball" ]] && curl -fsI -o /dev/null "$tarball"; then
                return 0
              fi
              sleep 10
            done
            echo "npm does not serve $1 after ten minutes."
            return 1
          }
          wait_for_npm "@evref-bl/pharo-launcher-mcp@${LAUNCHER_VERSION}"
          # Exact, never a range: nothing in the stack publishes a lockfile, so
          # a range is resolved fresh on every user's machine.
          npm pkg set "dependencies.@evref-bl/pharo-launcher-mcp=${LAUNCHER_VERSION}" \
            --workspace @evref-bl/plexus
          npm install
          npm run check
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create update pull request
        id: proposal
        if: steps.update.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The bot as author and committer both: left unset, the committer is
          # github-actions[bot] and the author whoever started the run.
          author: devnexus-automation[bot] <286661136+devnexus-automation[bot]@users.noreply.github.com>
          committer: devnexus-automation[bot] <286661136+devnexus-automation[bot]@users.noreply.github.com>
          branch: automation/update-launcher-v${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: "chore: update pharo-launcher-mcp to v${{ steps.release.outputs.version }}"
          title: "chore: update pharo-launcher-mcp to v${{ steps.release.outputs.version }}"
          body: |
            Automated update for the published pharo-launcher-mcp release.

            This only moves the pin. Releasing it is a separate version bump.

      - name: Merge after CI
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
        run: |
          for _ in {1..60}; do
            if gh pr checks "$PR_NUMBER" --json name --jq 'length' 2>/dev/null | grep -qx '[1-9][0-9]*'; then
              gh pr checks "$PR_NUMBER" --watch --interval 10
              # GitHub can refuse the merge for a few seconds after the last check
              # passes, and fail the branch deletion after a merge that worked: the
              # pull request's state says whether it merged.
              for _ in {1..12}; do
                gh pr merge "$PR_NUMBER" --squash --delete-branch || true
                [ "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = MERGED ] && exit 0
                sleep 10
              done
              echo "PR #$PR_NUMBER did not merge."
              exit 1
            fi
            sleep 5
          done
          echo "No CI checks were reported for PR #$PR_NUMBER."
          exit 1
