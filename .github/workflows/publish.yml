name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to publish.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          plexus_version=$(node -p "require('./packages/plexus-core/package.json').version")
          gateway_version=$(node -p "require('./packages/plexus-gateway/package.json').version")

          if ! [[ "$plexus_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "@evref-bl/plexus must use a release SemVer version: $plexus_version" >&2
            exit 1
          fi

          if [ "$gateway_version" != "$plexus_version" ]; then
            echo "Published PLexus workspaces must share one version: $plexus_version and $gateway_version." >&2
            exit 1
          fi

          if [ "v$plexus_version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $plexus_version." >&2
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm pack --workspace @evref-bl/plexus --dry-run
          npm pack --workspace @evref-bl/plexus-gateway --dry-run

      - name: Publish packages
        run: |
          npm publish --workspace @evref-bl/plexus --access public
          npm publish --workspace @evref-bl/plexus-gateway --access public
