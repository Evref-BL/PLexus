name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to publish.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          plexus_version=$(node -p "require('./packages/plexus/package.json').version")

          if ! [[ "$plexus_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "@evref-bl/plexus must use a release SemVer version: $plexus_version" >&2
            exit 1
          fi

          if [ "v$plexus_version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $plexus_version." >&2
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm pack --workspace @evref-bl/plexus --dry-run

      - name: Publish packages
        run: |
          npm publish --workspace @evref-bl/plexus --access public

      - name: Wait for published packages
        run: |
          version="$(node -p "require('./packages/plexus/package.json').version")"
          destination="$(mktemp -d)"
          trap 'rm -rf "$destination"' EXIT
          # Fetch the tarballs, not just the metadata: consumers install from
          # those, and they appear later than the version npm view reports.
          for _ in {1..60}; do
            if npm pack \
              "@evref-bl/plexus@${version}" \
              --pack-destination "$destination" \
              --prefer-online >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Published PLexus tarballs did not become installable from npm." >&2
          exit 1

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: pharo-agent-plugin

      - name: Notify released consumers
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          plexus_version="$(node -p "require('./packages/plexus/package.json').version")"
          mcp_version="$(sed -nE 's/export const defaultPharoMcpVersion = "([0-9]+\.[0-9]+\.[0-9]+)";/\1/p' packages/plexus/src/workspace/projectStartupScript.ts)"
          [[ "$mcp_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          jq -nc --arg plexus_version "$plexus_version" --arg mcp_version "$mcp_version" \
            '{event_type: "component-release", client_payload: {component: "plexus", version: $plexus_version, mcp_version: $mcp_version}}' |
            gh api --method POST repos/Evref-BL/pharo-agent-plugin/dispatches --input -
