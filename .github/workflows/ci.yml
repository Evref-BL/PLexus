name: CI

# Every push and pull request runs the matrix, so each check the default
# branch requires reports. A change that touches only documentation skips the
# steps after the checkout, and the check reports success.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 22.15 check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tell whether code changed
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep -vE '\.md$|^LICENSE$' || true)
          if [ -n "$code" ]; then echo 'code=true'; else echo 'code=false'; fi >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: ${{ steps.changes.outputs.code == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
          cache: npm

      - name: Install dependencies
        if: ${{ steps.changes.outputs.code == 'true' }}
        run: npm ci

      - name: Run checks
        if: ${{ steps.changes.outputs.code == 'true' }}
        run: npm run check
