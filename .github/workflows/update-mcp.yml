name: Propose MCP update

on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find the latest MCP release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/Evref-BL/MCP/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Update the pin and package version
        env:
          MCP_TAG: ${{ steps.release.outputs.tag }}
        run: |
          pin_file="packages/plexus-core/src/workspace/projectStartupScript.ts"
          current_tag="$(sed -nE 's/.*commitish: "(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$pin_file")"
          test -n "$current_tag"
          if [[ "$current_tag" == "$MCP_TAG" ]]; then
            exit 0
          fi
          sed -i -E "s/(commitish: \")v[0-9]+\.[0-9]+\.[0-9]+/\1${MCP_TAG}/" "$pin_file"
          npm version patch --workspaces --include-workspace-root --no-git-tag-version

      - name: Create or update proposal
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "automation/update-mcp-${{ steps.release.outputs.tag }}"
          delete-branch: true
          commit-message: "chore: update MCP to ${{ steps.release.outputs.tag }}"
          title: "chore: update MCP to ${{ steps.release.outputs.tag }}"
          body: |
            Automated proposal from PLexus's Monday release check.

            This updates the immutable MCP release tag and bumps the PLexus patch version.
